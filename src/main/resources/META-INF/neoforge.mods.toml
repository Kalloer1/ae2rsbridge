modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Kalloer1/ae2rsbridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
logoFile="icon.png"
logoBlur=false
description='''
${mod_description}

Exposes a Refined Storage 2 network to Applied Energistics 2 as a native storage cell.
- Shift-right-click RS cables/controllers to bind the cell to that RS network
- Place the cell in an ME Drive to allow AE2 terminals to read RS network contents natively
- Read-only (AE can browse/extract from RS, no write-back); push-mode refresh, zero idle overhead
- Two cell types:
  · "RS Network Storage Cell" exposes all types (RS has no type limits)
  · "RS Non-Stackable Cell" exposes only non-stackable items, specifically to free up AE disk 63-type quota
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    # AE2 for 1.21.1 (verify exact range on release)
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="required"
    # Refined Storage 2 (1.21.1) - verify modId + range against RS2 release
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"
