modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Kalloer1/ae2rsbridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
license="${mod_license}"
logoFile="icon.png"
logoBlur=false
description='''
${mod_description}

将 Refined Storage 2 网络以 AE2 原生存储单元形式暴露给 AE2 网格。
- 潜行右键 RS 线缆/控制器把单元绑定到该 RS 网络
- 把单元放入 ME 驱动器，AE2 终端即可原生读取 RS 网络内容
- 只读（AE 可浏览/从 RS 提取，不写回 RS）；推模式刷新，空闲零开销
- 两种单元：
  ·「RS 网络存储单元」暴露全部类型（RS 不限类型）
  ·「RS 不可堆叠单元」仅暴露不可堆叠物品，专用于释放 AE 磁盘 63 类型配额
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    # AE2 for 1.21.1 (verify exact range on release)
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="required"
    # Refined Storage 2 (1.21.1) — verify modId + range against RS2 release
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"
