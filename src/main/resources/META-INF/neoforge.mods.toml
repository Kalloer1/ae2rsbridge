modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/Kalloer1/ae2rsbridge/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}

Bidirectional storage bridge between Applied Energistics 2 and Refined Storage.
- AE2 terminals can access RS disk storage
- RS grids can access AE2 network storage
- Only items and fluids are bridged (no gases, mana, etc.)
- Acts as an energy converter between AE2 and Forge Energy (no self-consumption)
'''

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="${neo_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="ae2"
    type="required"
    # AE2 for 1.21.1 (verify exact range on release)
    versionRange="[19.0.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="refinedstorage"
    type="required"
    # Refined Storage 2 (1.21.1) — verify modId + range against RS2 release
    versionRange="[2.0.0,)"
    ordering="AFTER"
    side="BOTH"
