plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    // NeoForge ModDevGradle 2.0.142
    // 注意：NeoForge 21.1.209 已彻底移除 net.neoforged.fml 旧 API
    // （RegistryObject / FMLJavaModLoadingContext / NetworkHooks / ModLoadingContext 均不存在）。
    // 因此 mod 源码已移植到新 API：
    //   RegistryObject<T>        -> DeferredHolder<T,I>
    //   FMLJavaModLoadingContext -> @Mod 构造函数接收 IEventBus + ModContainer
    //   NetworkHooks.openScreen  -> player.openMenu(...)
    //   ModLoadingContext        -> ModContainer.registerConfig(...)
    id 'net.neoforged.moddev' version '2.0.142'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    // === 国内镜像（优先；加速中国网络，缺失自动回退到下方官方源） ===
    maven { url = 'https://maven.aliyun.com/repository/public' }   // 镜像 Maven Central（AE2 等）
    maven { url = 'https://bmclapi2.bangbang93.com/maven/' }       // 镜像 maven.neoforged.net / minecraftforge（NeoForge 本体）
    // === 官方源（回退） ===
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        // Refined Mods (Refined Storage 2) maven
        name = 'Refined Mods'
        url = 'https://maven.refinedmods.com/releases'
    }
    flatDir {
        name 'libs'
        dir file('libs')
    }
}

neoForge {
    version = neo_version

    // Parchment mappings for readable parameter/field names (optional)
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // === AE2 1.21.1 (NeoForge) — Maven Central, group org.appliedenergistics ===
    // 编译必须挂完整 jar：AEBaseMenu / appeng.client.gui.* / appeng.helpers.* 等实现类
    // 不在 :api 桩jar（仅 appeng.api.*）内。ModDevGradle 会按项目映射(parchment)自动重映射。
    compileOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"
    runtimeOnly "org.appliedenergistics:appliedenergistics2:${ae2_version}"

    // === Refined Storage 2 (RS2) 2.0.0 (NeoForge) ===
    // 用本地反编译得到的 jar（maven.refinedmods.com 在本机构建环境 DNS 不通）。
    // 在有网络的环境可改回:
    //   compileOnly "com.refinedmods.refinedstorage:refinedstorage-neoforge:${refinedstorage_version}"
    compileOnly files('libs/rs2-1.21.1.jar')
    runtimeOnly files('libs/rs2-1.21.1.jar')

    // === 注解（@Nullable/@Nonnull）— NeoForge 1.21.1 不再提供 javax.annotation ===
    compileOnly 'org.jetbrains:annotations:24.1.0'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : 'MIT',
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '9999'
}
