plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    // NeoForge ModDevGradle — verify latest 2.0.x at https://github.com/neoforged/ModDevGradle
    id 'net.neoforged.moddev' version '2.0.78'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 requires Java 21
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
        content {
            includeGroup 'maven.modrinth'
        }
    }
    maven {
        name = 'CurseMaven'
        url = 'https://www.cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        // Refined Mods (Refined Storage 2) maven
        name = 'Refined Mods'
        url = 'https://maven.refinedmods.com/releases'
    }
    flatDir {
        name 'libs'
        dir file('libs')
    }
}

neoForge {
    version = neo_version

    // Parchment mappings for readable parameter/field names (optional)
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    // === 1.21.1 dependency jars (place in libs/ or use maven coordinates) ===
    // AE2 for 1.21.1 — via Modrinth maven (verify version slug/id):
    //   compileOnly "maven.modrinth:ae2:${ae2_version}"
    // Refined Storage 2 (1.21.1, NeoForge) — full API rewrite vs 1.20.1:
    //   compileOnly "maven.modrinth:refined-storage:${refinedstorage_version}"
    //
    // Until the 1.21.1 dep jars are wired up, the RS/AE2 integration
    // sources will NOT compile against the old (1.20.1) API. See PORTING.md.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : 'MIT',
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xmaxerrs' << '9999'
}
